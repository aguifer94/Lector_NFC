<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tag Scanner</title>
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1a1a1a">
    
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">

    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #1a1a1a; color: white; text-align: center; padding: 20px; margin: 0; }
        .container { background: #2d2d2d; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); max-width: 400px; margin: auto; }
        h1 { font-size: 24px; margin-bottom: 20px; color: #fff; }
        .btn-scan { background: #007bff; color: white; border: none; padding: 20px; border-radius: 50%; width: 110px; height: 110px; font-weight: bold; font-size: 14px; cursor: pointer; box-shadow: 0 0 15px rgba(0,123,255,0.5); margin-bottom: 20px; transition: 0.3s; }
        .btn-scan:active { transform: scale(0.9); }
        .result-box { background: #111; padding: 15px; border-radius: 12px; margin-top: 10px; border: 1px solid #444; }
        .label { color: #888; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .value { font-family: 'Courier New', monospace; font-size: 20px; color: #00ff00; }
        .value-dec { font-size: 28px; color: #ffcc00; display: block; margin-bottom: 10px; font-weight: bold; }
        .btn-copy { background: #444; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 13px; cursor: pointer; width: 100%; font-weight: bold; text-transform: uppercase; }
        
        /* Estilos del Historial */
        .history-container { margin-top: 25px; text-align: left; background: #252525; padding: 15px; border-radius: 12px; border: 1px dashed #555; }
        .history-title { font-size: 14px; color: #bbb; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .history-list { list-style: none; padding: 0; margin: 0; max-height: 200px; overflow-y: auto; }
        .history-item { background: #1a1a1a; padding: 10px; border-radius: 6px; margin-bottom: 8px; border-left: 4px solid #ffcc00; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; }
        .history-item:active { background: #333; }
        .history-item span { font-family: monospace; font-size: 16px; color: #efefef; }
        .history-item small { color: #666; font-size: 10px; }

        #status { font-size: 13px; margin-top: 15px; color: #888; min-height: 18px; }
        .toast { visibility: hidden; background-color: #28a745; color: white; text-align: center; border-radius: 8px; padding: 12px; position: fixed; z-index: 10; bottom: 30px; left: 50%; transform: translateX(-50%); font-weight: bold; }
        .toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }
    </style>
</head>
<body>
    <div class="container">
        <h1>Tag Scanner</h1>
        <button class="btn-scan" id="scanBtn">ESCANEAR<br>NUEVO</button>
        
        <div class="result-box">
            <div class="label">Última Lectura (Decimal)</div>
            <div id="decVal" class="value value-dec">----------</div>
            <div class="label">Hex: <span id="hexVal" class="value" style="font-size: 14px; color: #00ff00;">--:--:--:--</span></div>
            <button class="btn-copy" id="copyBtn" style="margin-top:10px;">📋 Copiar ID</button>
        </div>

        <div id="status">Listo para trabajar</div>

        <div class="history-container">
            <div class="history-title">
                <span>LECTURAS RECIENTES</span>
                <small style="cursor:pointer; color:#007bff;" onclick="clearHistory()">Borrar</small>
            </div>
            <div id="historyList" class="history-list">
                </div>
        </div>
    </div>

    <div id="toast" class="toast">¡ID Copiado!</div>

    <script>
        const scanBtn = document.getElementById('scanBtn');
        const copyBtn = document.getElementById('copyBtn');
        const hexVal = document.getElementById('hexVal');
        const decVal = document.getElementById('decVal');
        const status = document.getElementById('status');
        const toast = document.getElementById('toast');
        const historyList = document.getElementById('historyList');

        let history = [];

        function showToast(msg = "¡ID Copiado!") {
            toast.innerText = msg;
            toast.className = "toast show";
            setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
        }

        async function copyToClipboard(text) {
            try {
                await navigator.clipboard.writeText(text);
                showToast();
            } catch (err) {
                console.error('Error al copiar', err);
            }
        }

        function addToHistory(decimal) {
            if (history[0] === decimal) return; // Evitar duplicados consecutivos
            history.unshift(decimal);
            if (history.length > 10) history.pop(); // Guardar solo los últimos 10
            renderHistory();
        }

        function renderHistory() {
            historyList.innerHTML = '';
            history.forEach((id) => {
                const item = document.createElement('div');
                item.className = 'history-item';
                item.onclick = () => copyToClipboard(id);
                item.innerHTML = `<span>${id}</span><small>Toca para copiar</small>`;
                historyList.appendChild(item);
            });
        }

        function clearHistory() {
            history = [];
            renderHistory();
        }

        scanBtn.addEventListener('click', async () => {
            if (!('NDEFReader' in window)) {
                alert("Usa Chrome en Android.");
                return;
            }

            try {
                const ndef = new NDEFReader();
                await ndef.scan();
                status.innerText = "📡 Acerca el Tag...";
                status.style.color = "#00ff00";

                ndef.onreading = ({ serialNumber }) => {
                    hexVal.innerText = serialNumber.toUpperCase();
                    
                    let raw = serialNumber.replace(/:/g, '');
                    let bytes = raw.match(/.{1,2}/g).reverse();
                    let bigEndianHex = bytes.join('');
                    
                    let decimal = BigInt("0x" + bigEndianHex).toString();
                    decVal.innerText = decimal;
                    
                    copyToClipboard(decimal);
                    addToHistory(decimal);
                    
                    status.innerText = "✅ Lectura exitosa";
                };
            } catch (error) {
                status.innerText = "❌ Error: Activa el NFC";
            }
        });

        copyBtn.addEventListener('click', () => {
            const val = decVal.innerText;
            if (val !== "----------") copyToClipboard(val);
        });
    </script>
</body>
</html>
