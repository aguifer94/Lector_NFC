<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tag Scanner</title>
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1a1a1a">
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">

    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #1a1a1a; color: white; text-align: center; padding: 15px; margin: 0; }
        .container { background: #2d2d2d; padding: 20px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); max-width: 400px; margin: auto; }
        h1 { font-size: 22px; margin-bottom: 15px; color: #fff; }
        
        .btn-scan { background: #007bff; color: white; border: none; padding: 15px; border-radius: 50%; width: 100px; height: 100px; font-weight: bold; font-size: 13px; cursor: pointer; box-shadow: 0 0 15px rgba(0,123,255,0.4); margin-bottom: 15px; transition: 0.3s; }
        .btn-scan:active { transform: scale(0.95); }

        .manual-input-box { background: #3d3d3d; padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #555; }
        .manual-input-box input { width: 90%; padding: 10px; border-radius: 6px; border: 1px solid #666; background: #111; color: #00ff00; text-align: center; font-family: monospace; font-size: 18px; text-transform: uppercase; outline: none; }

        .result-box { background: #111; padding: 15px; border-radius: 12px; margin-top: 10px; border: 1px solid #444; }
        .label { color: #888; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .value-dec { font-size: 28px; color: #ffcc00; display: block; margin-bottom: 10px; font-weight: bold; font-family: 'Courier New', monospace; }
        .btn-copy { background: #444; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 13px; cursor: pointer; width: 100%; font-weight: bold; }

        .history-container { margin-top: 20px; text-align: left; background: #252525; padding: 15px; border-radius: 12px; border: 1px dashed #555; }
        .history-title { font-size: 13px; color: #bbb; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .history-list { list-style: none; padding: 0; margin: 0; max-height: 200px; overflow-y: auto; }
        .history-item { background: #1a1a1a; padding: 10px; border-radius: 6px; margin-bottom: 8px; border-left: 4px solid #ffcc00; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .history-item span { font-family: monospace; font-size: 16px; font-weight: bold; }

        .actions-row { display: flex; gap: 10px; }
        .btn-action { background: none; border: 1px solid #007bff; color: #007bff; padding: 4px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; text-transform: uppercase; font-weight: bold; }
        .btn-action.clear { border-color: #ff4444; color: #ff4444; }

        #status { font-size: 12px; margin-top: 10px; color: #888; min-height: 18px; }
        .toast { visibility: hidden; background-color: #28a745; color: white; text-align: center; border-radius: 8px; padding: 12px; position: fixed; z-index: 10; bottom: 30px; left: 50%; transform: translateX(-50%); font-weight: bold; width: 200px; }
        .toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
        .toast.warn { background-color: #f39c12; }
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }
    </style>
</head>
<body>
    <div class="container">
        <h1>Tag Scanner</h1>
        
        <button class="btn-scan" id="scanBtn">ESCANEAR<br>TAG NFC</button>
        
        <div class="manual-input-box">
            <div class="label" style="margin-bottom:8px;">Ingreso Manual (Hexadecimal)</div>
            <input type="text" id="manualHex" placeholder="A1 B2 C3 D4" maxlength="11">
            <div id="status" style="margin-top:8px;">O acerca un tag al sensor</div>
        </div>

        <div class="result-box">
            <div class="label">Código Decimal Resultante</div>
            <div id="decVal" class="value value-dec">----------</div>
            <button class="btn-copy" id="copyBtn">📋 Copiar al Portapapeles</button>
        </div>

        <div class="history-container">
            <div class="history-title">
                <span>HISTORIAL</span>
                <div class="actions-row">
                    <button class="btn-action" id="downloadBtn">💾 TXT</button>
                    <button class="btn-action clear" id="clearBtn">🗑️ Limpiar</button>
                </div>
            </div>
            <div id="historyList" class="history-list"></div>
        </div>
    </div>

    <div id="toast" class="toast">¡Copiado!</div>

    <script>
        const scanBtn = document.getElementById('scanBtn');
        const manualInput = document.getElementById('manualHex');
        const copyBtn = document.getElementById('copyBtn');
        const decVal = document.getElementById('decVal');
        const status = document.getElementById('status');
        const toast = document.getElementById('toast');
        const historyList = document.getElementById('historyList');
        const clearBtn = document.getElementById('clearBtn');
        const downloadBtn = document.getElementById('downloadBtn');

        let history = JSON.parse(localStorage.getItem('tagHistorySimple')) || [];
        renderHistory();

        function showToast(msg = "¡ID Copiado!", isWarn = false) {
            toast.innerText = msg;
            toast.classList.remove('warn');
            if(isWarn) toast.classList.add('warn');
            toast.className += " show";
            setTimeout(() => { toast.className = toast.className.replace("show", "").replace("warn", ""); }, 3000);
        }

        async function copyToClipboard(text) {
            if (!text || text.includes('-')) return;
            try {
                await navigator.clipboard.writeText(text);
                showToast("¡ID Copiado!");
            } catch (err) { console.error('Error al copiar', err); }
        }

        function processHex(hex) {
            try {
                let cleanHex = hex.replace(/[:\s]/g, '').toUpperCase();
                if (cleanHex.length < 2) return;

                let bytes = cleanHex.match(/.{1,2}/g).reverse();
                let bigEndianHex = bytes.join('');
                
                let decimal = BigInt("0x" + bigEndianHex).toString();
                decVal.innerText = decimal;
                
                copyToClipboard(decimal);
                addToHistory(decimal);
            } catch (e) { }
        }

        manualInput.addEventListener('input', (e) => {
            if (e.target.value.length >= 8) processHex(e.target.value);
        });

        function addToHistory(decimal) {
            // Verificar duplicado
            if (history.includes(decimal)) {
                showToast("ID ya en historial", true);
                status.innerText = "⚠️ Tag repetido";
                return;
            }

            history.unshift(decimal);
            if (history.length > 100) history.pop(); // Capacidad de 100
            
            localStorage.setItem('tagHistorySimple', JSON.stringify(history));
            renderHistory();
        }

        function renderHistory() {
            historyList.innerHTML = '';
            history.forEach((id) => {
                const div = document.createElement('div');
                div.className = 'history-item';
                div.onclick = () => copyToClipboard(id);
                div.innerHTML = `<span>${id}</span><small>Copiar</small>`;
                historyList.appendChild(div);
            });
        }

        // Descarga solo la lista de decimales
        downloadBtn.addEventListener('click', () => {
            if (history.length === 0) {
                alert("El historial está vacío.");
                return;
            }
            
            // Unir la lista con saltos de línea
            const contenido = history.join("\n");
            
            const blob = new Blob([contenido], { type: "text/plain" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            const fechaLabel = new Date().toISOString().slice(0,10);
            
            a.href = url;
            a.download = `tags_${fechaLabel}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });

        clearBtn.addEventListener('click', () => {
            if(confirm("¿Borrar historial?")) {
                history = [];
                localStorage.removeItem('tagHistorySimple');
                renderHistory();
            }
        });

        scanBtn.addEventListener('click', async () => {
            if (!('NDEFReader' in window)) {
                alert("NFC no compatible.");
                return;
            }
            try {
                const ndef = new NDEFReader();
                await ndef.scan();
                status.innerText = "📡 Sensor activo...";
                status.style.color = "#00ff00";

                ndef.onreading = ({ serialNumber }) => {
                    manualInput.value = serialNumber.toUpperCase();
                    processHex(serialNumber);
                    if (status.innerText !== "⚠️ Tag repetido") {
                        status.innerText = "✅ Leído";
                        status.style.color = "#00ff00";
                    }
                };
            } catch (error) { status.innerText = "❌ Error NFC"; }
        });

        copyBtn.addEventListener('click', () => copyToClipboard(decVal.innerText));
    </script>
</body>
</html>
