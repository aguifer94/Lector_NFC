<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lector Tarjetas RF</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1a1a1a; color: white; text-align: center; padding: 20px; }
        .container { background: #2d2d2d; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); max-width: 400px; margin: auto; }
        .btn-scan { background: #007bff; color: white; border: none; padding: 20px; border-radius: 50%; width: 120px; height: 120px; font-weight: bold; font-size: 16px; cursor: pointer; box-shadow: 0 0 15px #007bff; margin-bottom: 20px; transition: 0.3s; }
        .btn-scan:active { transform: scale(0.9); box-shadow: 0 0 5px #007bff; }
        .result-box { background: #111; padding: 15px; border-radius: 10px; margin-top: 20px; border: 1px solid #444; }
        .label { color: #888; font-size: 12px; text-transform: uppercase; margin-bottom: 5px; }
        .value { font-family: 'Courier New', Courier, monospace; font-size: 24px; color: #00ff00; font-weight: bold; }
        .value-dec { font-size: 32px; color: #ffcc00; }
        #status { font-size: 14px; margin-top: 15px; color: #aaa; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Lector de Tags RF</h2>
        <button class="btn-scan" id="scanBtn">ESCANEAR<br>TARJETA</button>
        
        <div class="result-box">
            <div class="label">ID Hexadecimal (UID)</div>
            <div id="hexVal" class="value">-- : -- : -- : --</div>
        </div>

        <div class="result-box">
            <div class="label">Código Decimal (Little-Endian)</div>
            <div id="decVal" class="value value-dec">----------</div>
        </div>

        <div id="status">Pulsa el botón para activar el sensor</div>
    </div>

    <script>
        const scanBtn = document.getElementById('scanBtn');
        const hexVal = document.getElementById('hexVal');
        const decVal = document.getElementById('decVal');
        const status = document.getElementById('status');

        scanBtn.addEventListener('click', async () => {
            if (!('NDEFReader' in window)) {
                alert("Tu navegador no soporta lectura NFC o estás en una conexión no segura (HTTP).");
                return;
            }

            try {
                const ndef = new NDEFReader();
                await ndef.scan();
                status.innerText = "📡 Sensor activo. Acerca el Tag...";
                status.style.color = "#00ff00";

                ndef.onreadingerror = () => {
                    status.innerText = "❌ Error de lectura. Intenta de nuevo.";
                };

                ndef.onreading = ({ serialNumber }) => {
                    // 1. Mostrar Hex Original
                    hexVal.innerText = serialNumber.toUpperCase();
                    
                    // 2. Procesar Little-Endian (tomando 4 bytes)
                    let raw = serialNumber.replace(/:/g, '');
                    let bytes = raw.match(/.{1,2}/g).reverse();
                    let bigEndianHex = bytes.join('');
                    
                    // 3. Convertir a Decimal con BigInt para precisión total
                    let decimal = BigInt("0x" + bigEndianHex);
                    decVal.innerText = decimal.toString();
                    
                    status.innerText = "✅ Lectura completada";
                };
            } catch (error) {
                status.innerText = "❌ Error: " + error;
            }
        });
    </script>
</body>
</html>
