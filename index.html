<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tag Scanner Pro</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="TagScanner">
    <link rel="apple-touch-icon" href="logo.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1a1a1a">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="logo.png">

    <style>
        /* --- ESTILOS DEL SPLASH SCREEN --- */
        #splash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #1a1a1a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s;
        }
        #splash img {
            width: 150px;
            height: 150px;
            border-radius: 30px;
            box-shadow: 0 0 30px rgba(0, 123, 255, 0.3);
            margin-bottom: 20px;
        }
        #splash .loader {
            width: 40px;
            height: 40px;
            border: 4px solid #333;
            border-top: 4px solid #007bff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* --- ESTILOS DE LA APP --- */
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #1a1a1a; color: white; text-align: center; padding: 15px; margin: 0; transition: background-color 0.3s; -webkit-tap-highlight-color: transparent; }
        .container { background: #2d2d2d; padding: 20px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); max-width: 400px; margin: auto; }
        
        body.duplicate-error { background-color: #7b1111; }
        body.duplicate-error .container { border: 2px solid #ff4444; }

        h1 { font-size: 22px; margin-bottom: 15px; color: #fff; }
        
        .btn-scan { background: #007bff; color: white; border: none; padding: 15px; border-radius: 50%; width: 100px; height: 100px; font-weight: bold; font-size: 13px; cursor: pointer; box-shadow: 0 0 15px rgba(0,123,255,0.4); margin-bottom: 15px; position: relative; }
        .btn-scan:disabled { background: #444; box-shadow: none; opacity: 0.6; cursor: not-allowed; }

        .manual-input-box { background: #3d3d3d; padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #555; }
        .manual-input-box input { width: 90%; padding: 12px; border-radius: 8px; border: 1px solid #666; background: #111; color: #00ff00; text-align: center; font-family: monospace; font-size: 20px; text-transform: uppercase; outline: none; }

        .result-box { background: #111; padding: 15px; border-radius: 12px; margin-top: 10px; border: 1px solid #444; }
        .value-dec { font-size: 32px; color: #ffcc00; display: block; margin-bottom: 10px; font-weight: bold; font-family: 'Courier New', monospace; letter-spacing: 2px; }
        .btn-copy { background: #444; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 13px; cursor: pointer; width: 100%; font-weight: bold; }

        .history-list { list-style: none; padding: 0; margin: 10px 0; max-height: 200px; overflow-y: auto; }
        .history-item { background: #1a1a1a; padding: 12px; border-radius: 8px; margin-bottom: 8px; border-left: 4px solid #ffcc00; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .history-item span { font-family: monospace; font-size: 16px; font-weight: bold; }
        
        .actions-row { display: flex; gap: 10px; margin-top: 15px; }
        .btn-action { flex: 1; background: none; border: 1px solid #007bff; color: #007bff; padding: 10px; border-radius: 8px; font-size: 12px; cursor: pointer; font-weight: bold; text-transform: uppercase; }
        
        #status { font-size: 14px; margin: 10px 0; font-weight: bold; color: #888; min-height: 20px; }
        .warning-text { color: #ff4444; font-size: 16px; display: none; font-weight: bold; animation: blink 0.5s infinite alternate; padding: 5px; }
        @keyframes blink { from { opacity: 1; } to { opacity: 0.5; } }
        .ios-notice { font-size: 11px; color: #ffa500; margin-top: 5px; display: none; }
    </style>
</head>
<body>

    <div id="splash">
        <img src="logo.png" alt="Logo">
        <div class="loader"></div>
    </div>

    <div class="container">
        <h1>Tag Scanner Pro</h1>
        
        <button class="btn-scan" id="scanBtn">ESCANEAR<br>NFC</button>
        <div id="status">Compatible con Android</div>
        <div id="duplicateWarning" class="warning-text">⚠️ TAG YA REGISTRADO ⚠️</div>
        <div id="iosNotice" class="ios-notice">⚠️ iPhone requiere ingreso manual abajo.</div>

        <div class="manual-input-box" style="margin-top: 10px;">
            <input type="text" id="manualHex" placeholder="HEX AQUÍ" maxlength="15">
        </div>

        <div class="result-box">
            <div id="decVal" class="value-dec">----------</div>
            <button class="btn-copy" id="copyBtn">📋 COPIAR DECIMAL</button>
        </div>

        <div style="margin-top:20px; text-align:left;">
            <div style="display:flex; justify-content:space-between; color:#bbb; font-size:12px; margin-bottom: 5px;">
                <span>HISTORIAL RECIENTE</span>
                <span id="count">0</span>
            </div>
            <div id="historyList" class="history-list"></div>
            <div class="actions-row">
                <button class="btn-action" id="downloadBtn">💾 BAJAR TXT</button>
                <button class="btn-action" style="border-color:#ff4444; color:#ff4444;" id="clearBtn">🗑️ LIMPIAR</button>
            </div>
        </div>
    </div>

    <script>
        // --- LÓGICA DEL SPLASH SCREEN ---
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash');
                splash.style.opacity = '0';
                setTimeout(() => {
                    splash.style.visibility = 'hidden';
                }, 500);
            }, 1200); // Se queda 1.2 segundos
        });

        // --- RESTO DE LA LÓGICA DE LA APP ---
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        const scanBtn = document.getElementById('scanBtn');
        const iosNotice = document.getElementById('iosNotice');
        const manualInput = document.getElementById('manualHex');
        const decVal = document.getElementById('decVal');
        const status = document.getElementById('status');
        const duplicateWarning = document.getElementById('duplicateWarning');
        const historyList = document.getElementById('historyList');

        if (isIOS) {
            scanBtn.disabled = true;
            iosNotice.style.display = 'block';
            status.style.display = 'none';
        }

        let history = JSON.parse(localStorage.getItem('tagHistorySimple')) || [];
        updateCount();
        renderHistory();

        function setDuplicateError(isError) {
            if (isError) {
                document.body.classList.add('duplicate-error');
                duplicateWarning.style.display = 'block';
                status.style.visibility = 'hidden';
            } else {
                document.body.classList.remove('duplicate-error');
                duplicateWarning.style.display = 'none';
                status.style.visibility = 'visible';
            }
        }

        function processHex(hex) {
            let cleanHex = hex.replace(/[^a-fA-F0-9]/g, '').toUpperCase();
            if (cleanHex.length < 8) return;

            let bytes = cleanHex.match(/.{1,2}/g).reverse();
            let bigEndianHex = bytes.join('');
            let decimal10 = BigInt("0x" + bigEndianHex).toString().padStart(10, '0');
            
            if (history.includes(decimal10)) {
                setDuplicateError(true);
                return;
            }

            setDuplicateError(false);
            decVal.innerText = decimal10;
            navigator.clipboard.writeText(decimal10);
            
            history.unshift(decimal10);
            if (history.length > 100) history.pop();
            localStorage.setItem('tagHistorySimple', JSON.stringify(history));
            renderHistory();
            updateCount();
            status.innerText = "✅ Leído: " + decimal10;
        }

        manualInput.addEventListener('input', (e) => {
            if (e.target.value.replace(/[^a-fA-F0-9]/g, '').length >= 8) {
                processHex(e.target.value);
            }
        });

        function renderHistory() {
            historyList.innerHTML = history.map(id => `
                <div class="history-item" onclick="navigator.clipboard.writeText('${id}'); document.getElementById('decVal').innerText='${id}'; document.body.classList.remove('duplicate-error'); document.getElementById('duplicateWarning').style.display='none';">
                    <span>${id}</span>
                    <small style="color:#007bff">Copiar</small>
                </div>
            `).join('');
        }

        function updateCount() { document.getElementById('count').innerText = history.length; }

        document.getElementById('downloadBtn').onclick = () => {
            if (history.length === 0) return;
            const now = new Date();
            const fileName = `Tags-${String(now.getDate()).padStart(2,'0')}-${String(now.getMonth()+1).padStart(2,'0')}-${now.getFullYear()}-${String(now.getHours()).padStart(2,'0')}-${String(now.getMinutes()).padStart(2,'0')}.txt`;
            const blob = new Blob([history.join("\n")], { type: "text/plain" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = fileName;
            a.click();
        };

        document.getElementById('clearBtn').onclick = () => {
            if(confirm("¿Borrar historial?")) { 
                history=[]; localStorage.removeItem('tagHistorySimple'); renderHistory(); updateCount(); 
                setDuplicateError(false); decVal.innerText = '----------';
            }
        };

        scanBtn.onclick = async () => {
            try {
                const ndef = new NDEFReader();
                await ndef.scan();
                setDuplicateError(false);
                status.innerText = "📡 BUSCANDO...";
                ndef.onreading = ({ serialNumber }) => {
                    manualInput.value = serialNumber.toUpperCase();
                    processHex(serialNumber);
                };
            } catch (e) { alert("NFC no compatible"); }
        };
        
        document.getElementById('copyBtn').onclick = () => navigator.clipboard.writeText(decVal.innerText);

        // Registro del Service Worker para modo Offline
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log(err));
            });
        }
    </script>
</body>
</html>
